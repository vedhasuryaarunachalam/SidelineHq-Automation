name: Playwright Tests

on:
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node + npm cache
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Cache Playwright browsers
      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # Install browsers
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # Run tests in parallel
      - name: Run Playwright tests
        id: playwright
        run: |
          npx playwright test --workers=4 --reporter=json,html > test-results.json
        continue-on-error: true

      # Upload HTML report
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results.json
          retention-days: 30

      # Generate failure summary
      - name: Generate Test Summary
        if: always()
        id: summary
        run: |
          node <<'EOF'
          const fs = require('fs');

          let summary = '## ✅ Playwright Test Summary\n\n';
          let failedTests = [];

          try {
            const data = JSON.parse(fs.readFileSync('test-results.json', 'utf8'));

            const suites = data.suites || [];

            function extractTests(suites) {
              for (const suite of suites) {
                if (suite.specs) {
                  for (const spec of suite.specs) {
                    for (const test of spec.tests) {
                      const result = test.results?.[0];

                      if (result?.status === 'failed') {
                        failedTests.push({
                          title: spec.title,
                          error: result.error?.message || 'Unknown error'
                        });
                      }
                    }
                  }
                }

                if (suite.suites) {
                  extractTests(suite.suites);
                }
              }
            }

            extractTests(suites);

            if (failedTests.length === 0) {
              summary += '### 🎉 All tests passed\n';
            } else {
              summary += `### ❌ Failed Tests (${failedTests.length})\n\n`;

              for (const test of failedTests.slice(0, 10)) {
                summary += `- **${test.title}**\n`;
                summary += `  \`\`\`\n`;
                summary += `${test.error.substring(0, 300)}\n`;
                summary += `  \`\`\`\n\n`;
              }

              if (failedTests.length > 10) {
                summary += `...and ${failedTests.length - 10} more failed tests.\n`;
              }
            }

            fs.writeFileSync('pr-comment.md', summary);
          } catch (e) {
            fs.writeFileSync(
              'pr-comment.md',
              '❌ Failed to parse Playwright test results.'
            );
          }
          EOF

      # Comment PR with summary
      - name: Comment PR with Test Summary
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('pr-comment.md', 'utf8');

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });