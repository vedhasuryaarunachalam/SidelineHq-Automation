name: Playwright Tests

on:
  push:
    branches: [ main, master ]

  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # Run tests but don't stop workflow immediately
      - name: Run Playwright tests
        id: playwright
        run: npx playwright test
        continue-on-error: true

      # Upload report always
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # Comment on PR if tests fail
      - name: Comment PR with Playwright Report
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `
            ❌ Playwright tests failed.

            📄 Playwright report artifact has been uploaded.

            Go to:
            Actions → This Workflow Run → Artifacts → playwright-report
            `;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      # Fail workflow at end if tests failed
      - name: Fail workflow if Playwright failed
        if: steps.playwright.outcome == 'failure'
        run: exit 1