name: Playwright Tests

on:
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js + npm cache
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Cache Playwright browsers
      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # Install Playwright browsers
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # Run Playwright tests
      - name: Run Playwright Tests
        id: playwright
        run: npx playwright test --workers=4
        continue-on-error: true

      # Upload Playwright HTML report
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results.json
          retention-days: 30

      # Generate PR comment summary
      - name: Generate Test Summary
        if: always()
        run: |
          node <<'EOF'
          const fs = require('fs');

          let summary = `# 🎭 Playwright Test Summary\n\n`;

          let stats = {
            total: 0,
            passed: 0,
            failed: 0,
            skipped: 0,
            timedOut: 0
          };

          let failedTests = [];

          try {

            const data = JSON.parse(
              fs.readFileSync('test-results.json', 'utf8')
            );

            const suites = data.suites || [];

            function extractTests(suites) {

              for (const suite of suites) {

                if (suite.specs) {

                  for (const spec of suite.specs) {

                    for (const test of spec.tests) {

                      stats.total++;

                      const result = test.results?.[0];
                      const status = result?.status;

                      switch (status) {

                        case 'passed':
                          stats.passed++;
                          break;

                        case 'failed':
                          stats.failed++;

                          failedTests.push({
                            title: spec.title,
                            project: test.projectName || 'unknown',
                            error:
                              result.error?.message ||
                              'Unknown error'
                          });

                          break;

                        case 'skipped':
                          stats.skipped++;
                          break;

                        case 'timedOut':
                          stats.timedOut++;
                          break;
                      }
                    }
                  }
                }

                if (suite.suites) {
                  extractTests(suite.suites);
                }
              }
            }

            extractTests(suites);

            summary += `
| Metric | Count |
|---|---|
| ✅ Passed | ${stats.passed} |
| ❌ Failed | ${stats.failed} |
| ⏭️ Skipped | ${stats.skipped} |
| ⏰ Timed Out | ${stats.timedOut} |
| 🧪 Total | ${stats.total} |

`;

            if (failedTests.length > 0) {

              summary += `## ❌ Failed Tests\n\n`;

              for (const test of failedTests.slice(0, 10)) {

                summary += `### ${test.title}\n\n`;

                summary += `**Project:** ${test.project}\n\n`;

                summary += '```text\n';

                summary += test.error.substring(0, 500);

                summary += '\n```\n\n';
              }

              if (failedTests.length > 10) {

                summary += `...and ${
                  failedTests.length - 10
                } more failed tests.\n`;
              }

            } else {

              summary += `## 🎉 All tests passed\n`;
            }

            summary += `
## 📄 Playwright Report

Download the \`playwright-report\` artifact from this workflow run.
`;

            fs.writeFileSync('pr-comment.md', summary);

          } catch (e) {

            fs.writeFileSync(
              'pr-comment.md',
              `❌ Failed to parse Playwright results.\n\n${e.message}`
            );
          }
          EOF

      # Comment on PR
      - name: Comment PR with Test Summary
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const body = fs.readFileSync(
              'pr-comment.md',
              'utf8'
            );

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });